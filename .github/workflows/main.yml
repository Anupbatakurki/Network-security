name: Network Security MLOps CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          echo "Running tests..."
          python -c "import fastapi; import pandas; import sklearn; print('Dependencies OK')"

      - name: Build Docker Image
        run: |
          docker build -t networksecurity:${{ github.sha }} .


  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Tag Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker tag \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull Latest Docker Image
        shell: powershell
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          AWS_ACCOUNT_ID: "724772093227"

        run: |
          if ([string]::IsNullOrWhiteSpace($env:AWS_REGION)) {
              throw "AWS_REGION secret is empty"
          }

          if ([string]::IsNullOrWhiteSpace($env:ECR_REPOSITORY)) {
              throw "ECR_REPOSITORY_NAME secret is empty"
          }

          $ECR_REGISTRY = "$env:AWS_ACCOUNT_ID.dkr.ecr.$env:AWS_REGION.amazonaws.com"
          $IMAGE = "${ECR_REGISTRY}/${env:ECR_REPOSITORY}:latest"

          Write-Host "Pulling latest Docker image..."
          Write-Host "Image: $IMAGE"

          docker pull $IMAGE

          if ($LASTEXITCODE -ne 0) {
              throw "Docker pull failed"
          }


      - name: Stop Existing Container
        shell: powershell
        run: |
          $container = docker ps -aq -f "name=networksecurity"

          if ($container) {

              Write-Host "Existing container found: $container"

              docker stop networksecurity

              if ($LASTEXITCODE -ne 0) {
                  Write-Host "Container was already stopped"
              }

              docker rm networksecurity

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to remove existing container"
              }

              Write-Host "Existing container removed successfully"

          }
          else {

              Write-Host "No existing container found."
              Write-Host "Continuing deployment..."

          }


      - name: Run Docker Container
        shell: powershell
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          AWS_ACCOUNT_ID: "724772093227"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MONGODB_URL_KEY: ${{ secrets.MONGODB_URL_KEY }}

        run: |

          if ([string]::IsNullOrWhiteSpace($env:ECR_REPOSITORY)) {
              throw "ECR_REPOSITORY_NAME secret is empty"
          }

          $ECR_REGISTRY = "$env:AWS_ACCOUNT_ID.dkr.ecr.$env:AWS_REGION.amazonaws.com"
          $IMAGE = "${ECR_REGISTRY}/${env:ECR_REPOSITORY}:latest"

          Write-Host "Starting Docker container..."
          Write-Host "Image: $IMAGE"

          docker run -d `
            -p 8000:8000 `
            --name networksecurity `
            -e AWS_ACCESS_KEY_ID="$env:AWS_ACCESS_KEY_ID" `
            -e AWS_SECRET_ACCESS_KEY="$env:AWS_SECRET_ACCESS_KEY" `
            -e AWS_REGION="$env:AWS_REGION" `
            -e MONGODB_URL_KEY="$env:MONGODB_URL_KEY" `
            $IMAGE

          if ($LASTEXITCODE -ne 0) {
              throw "Docker container failed to start"
          }

          Write-Host "Docker container started successfully."


      - name: Check Container
        shell: powershell
        run: |

          Write-Host "Running containers:"
          docker ps

          Write-Host "Container status:"
          docker inspect -f "{{.State.Status}}" networksecurity

          Write-Host "Container logs:"
          docker logs --tail 50 networksecurity


      - name: Clean Docker Images
        shell: powershell
        run: |

          Write-Host "Cleaning unused Docker images..."

          docker image prune -af

          Write-Host "Docker cleanup completed."