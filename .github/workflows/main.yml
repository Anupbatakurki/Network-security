name: Network Security MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Import Check
        run: |
          python -c "import fastapi; import pandas; import sklearn; print('Dependencies OK')"

      - name: Build Docker Image
        run: |
          docker build -t network-security-mlops .

      - name: Run Docker Container
        run: |
          docker run -d \
            --name network-security-container \
            -p 8000:8000 \
            network-security-mlops

      - name: Wait for Application
        run: |
          sleep 10

      - name: Test FastAPI
        run: |
          curl --fail http://localhost:8000/docs

      - name: Stop Docker Container
        if: always()
        run: |
          docker stop network-security-container || true